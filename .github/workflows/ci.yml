name: 持续集成 (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Redis：sharedState 有内存/Redis 双后端，类型契约必须两后端一致
      # （曾因不一致导致生产 500：内存版原样存取字符串，Redis 版 get 时 JSON.parse
      #   成对象 → res.end(对象) 抛 ERR_INVALID_ARG_TYPE）
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm ci

      - name: 🏗️ 构建三端
        run: npm run build:all

      - name: 🧪 全量测试（API + 集成 + Vue）
        run: npm run test:all
        env:
          NODE_ENV: test
          DATABASE_URL_TEST: postgres://shop:shop@127.0.0.1:5432/shop_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/9
          JWT_SECRET: ci-test-jwt-secret-key-at-least-32-chars-long
          JWT_ADMIN_SECRET: ci-test-admin-secret-key-at-least-32-chars
          JWT_PARTNER_SECRET: ci-test-partner-secret-key-at-least-32-chars
          CAPTCHA_SECRET: ci-test-captcha-secret-key-at-least-32-chars

      - name: 📊 覆盖率门禁
        run: npm run test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL_TEST: postgres://shop:shop@127.0.0.1:5432/shop_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/9
          JWT_SECRET: ci-test-jwt-secret-key-at-least-32-chars-long
          JWT_ADMIN_SECRET: ci-test-admin-secret-key-at-least-32-chars
          JWT_PARTNER_SECRET: ci-test-partner-secret-key-at-least-32-chars
          CAPTCHA_SECRET: ci-test-captcha-secret-key-at-least-32-chars

      - name: 💾 保存覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm ci

      # 只审计生产依赖（--omit=dev）：dev 工具链（vitest/vite/tailwind 等）的上游告警
      # 不进产物运行时，不应阻塞发布；生产依赖当前 0 high / 0 critical
      - name: 🔐 生产依赖漏洞门禁（High/Critical 失败）
        run: npm audit --omit=dev --registry=https://registry.npmjs.org --audit-level=high

      - name: 🧾 dev 工具链漏洞快照（仅告警，不阻塞）
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high || true

  browser-e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm ci

      - name: 🌐 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 🏗️ 构建三端
        run: npm run build:all

      - name: 🎭 真实浏览器 E2E
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL_TEST: postgres://shop:shop@127.0.0.1:5432/shop_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/9
          JWT_SECRET: ci-test-jwt-secret-key-at-least-32-chars-long
          JWT_ADMIN_SECRET: ci-test-admin-secret-key-at-least-32-chars
          JWT_PARTNER_SECRET: ci-test-partner-secret-key-at-least-32-chars
          CAPTCHA_SECRET: ci-test-captcha-secret-key-at-least-32-chars

      - name: 💾 保存 E2E 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
