# Rate limiting zone for robot-cockpit
limit_req_zone $binary_remote_addr zone=robot_rate_limit:10m rate=30r/s;

# HTTP -> HTTPS
server {
    listen 80;
    server_name robot.cider-bar.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name robot.cider-bar.com;

    ssl_certificate /etc/letsencrypt/live/cider-bar-subs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cider-bar-subs/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    keepalive_timeout 70;

    location / {
        limit_req zone=robot_rate_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        client_max_body_size 50M;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
