server {
    listen 80;
    listen [::]:80;
    server_name mp.cider-bar.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mp.cider-bar.com;

    ssl_certificate /etc/letsencrypt/live/cider-bar-subs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cider-bar-subs/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mp.cider-bar.com/site;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location ~* \.(?:css|js|svg|ico|png|jpg|jpeg|webp|woff2|woff|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/mp.cider-bar.access.log;
    error_log /var/log/nginx/mp.cider-bar.error.log;
}
