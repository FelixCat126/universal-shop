# game.cider-bar.com static arcade
# isolated config; does not modify any existing server blocks
server {
    server_name game.cider-bar.com;

    root /var/www/game.cider-bar.com/site;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location ~* \.(?:css|js|svg|ico|png|jpg|jpeg|webp)$ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/game.cider-bar.access.log;
    error_log /var/log/nginx/game.cider-bar.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cider-bar-subs/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cider-bar-subs/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = game.cider-bar.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name game.cider-bar.com;
    return 404; # managed by Certbot
}
