# Rate limiting zone
limit_req_zone $binary_remote_addr zone=cider_rate_limit:10m rate=20r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      keep-alive;
}

# HTTP -> HTTPS redirect for cider-bar.com
server {
    listen 80;
    server_name cider-bar.com www.cider-bar.com;
    return 301 https://$host$request_uri;
}

# HTTPS server for cider-bar.com
server {
    listen 443 ssl;
    server_name cider-bar.com www.cider-bar.com;

    ssl_certificate /etc/letsencrypt/live/cider-bar-main/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cider-bar-main/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Optimization
    keepalive_timeout 70;

    # Proxy to Cider Bar web service (Docker container on port 3002)
    location / {
        limit_req zone=cider_rate_limit burst=50 nodelay;
        
        # Block common scrapers
        if ($http_user_agent ~* (Scrapy|Curl|HttpClient|Java|Python|Wget|Go-http-client)) {
            return 403;
        }

        proxy_pass http://localhost:3002;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for long operations (e.g. export)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        
        # Buffer settings for large responses (exports)
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 100M;
        
        # Forward real IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
