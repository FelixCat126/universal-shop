# Rate limiting zone for eshop
limit_req_zone $binary_remote_addr zone=eshop_rate_limit:10m rate=30r/s;

# HTTP -> HTTPS
server {
    listen 80;
    server_name eshop.cider-bar.com;
    return 301 https://$host$request_uri;
}

server {
    # HTTP/3（QUIC）：第 52 轮开启
    #
    # 为什么：客户端到这台机器的链路上有 TCP SYN 丢包 → 触发 1s RTO 重传，
    # 表现为「首字节慢、时好时坏」。QUIC 的首包带冗余，不依赖 TCP 三次握手，
    # 丢一个包也不必重传整个连接 —— 正好对症。
    #
    # `quic reuseport` 是 nginx 官方文档要求的写法（多 worker 共享 UDP 端口）。
    # `http2 on;` 是 1.25+ 的新指令；旧的 `listen ... http2` 已废弃。
    #
    # 需要阿里云安全组放行 **UDP 443**（TCP 443 已有）。
    # 没放行也不会坏 —— 客户端自动回退到 HTTP/2/1.1，只是没有 QUIC 收益。
    listen 443 ssl;
    listen 443 quic reuseport;
    http2 on;

    server_name eshop.cider-bar.com;

    ssl_certificate /etc/letsencrypt/live/cider-bar-subs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cider-bar-subs/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    keepalive_timeout 70;

    # 压缩（第 52 轮）：静态资源此前**完全未压缩** ——
    # /portal/assets/*.js 有 288KB，而 nginx 层没有 gzip，
    # Express 的 compression() 只管得到达应用层的响应，静态文件是 nginx 直接吐的。
    #
    # 只影响本站点（放在 server 块内），不动其它站点的行为。
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    location / {
        limit_req zone=eshop_rate_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        client_max_body_size 50M;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
